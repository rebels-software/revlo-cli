[project]
name = "revlo"
version = "0.1.0"
description = "AI-powered design review for KiCad schematics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.78.0",
    "claude-agent-sdk>=0.1.36",
    "fastapi>=0.128.2",
    "httpx>=0.28.1",
    "kicad-sch-api>=0.5.6",
    "kiutils>=1.4.8",
    "pydantic>=2.12.5",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "textual>=0.89.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[project.scripts]
revlo = "revlo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revlo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
